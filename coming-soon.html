<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - ArtCraft Supply Store</title>
    <meta name="description" content="ArtCraft is working on exciting new features to fuel your creativity. Stay tuned for our upcoming launch!">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @keyframes morphBlob {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
        }
    </style>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-hero);position:relative;overflow:hidden;">
    <!-- Decorative shapes -->
    <div style="position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:var(--primary);opacity:0.06;border-radius:30% 70% 70% 30%/30% 30% 70% 70%;animation:morphBlob 8s ease-in-out infinite;"></div>
    <div style="position:absolute;bottom:-80px;left:-80px;width:250px;height:250px;background:var(--accent);opacity:0.05;border-radius:70% 30% 30% 70%/70% 70% 30% 30%;animation:morphBlob 10s ease-in-out infinite reverse;"></div>

    <div class="text-center" style="max-width:600px;padding:40px;position:relative;z-index:2;">
        <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4">
            <span style="font-size:2rem;"><i class="fas fa-palette" style="color:var(--primary);"></i></span>
            <span style="font-family:var(--font-accent);font-size:2rem;font-weight:700;color:var(--primary);">ArtCraft</span>
        </a>

        <h1 style="font-size:2.5rem;margin-bottom:16px;">Something Creative<br>is Coming Soon</h1>
        <p class="text-muted mb-4" style="font-size:1.1rem;">We're crafting new experiences to fuel your creativity. Be the first to know when we launch!</p>

        <!-- Countdown -->
        <div class="d-flex gap-3 justify-content-center mb-5">
            <div style="background:var(--bg-card);border-radius:12px;padding:16px 20px;min-width:80px;box-shadow:var(--shadow-md);">
                <div style="font-size:2rem;font-weight:800;font-family:var(--font-heading);color:var(--primary);" class="countdown-days">00</div>
                <small class="text-muted">Days</small>
            </div>
            <div style="background:var(--bg-card);border-radius:12px;padding:16px 20px;min-width:80px;box-shadow:var(--shadow-md);">
                <div style="font-size:2rem;font-weight:800;font-family:var(--font-heading);color:var(--primary);" class="countdown-hours">00</div>
                <small class="text-muted">Hours</small>
            </div>
            <div style="background:var(--bg-card);border-radius:12px;padding:16px 20px;min-width:80px;box-shadow:var(--shadow-md);">
                <div style="font-size:2rem;font-weight:800;font-family:var(--font-heading);color:var(--primary);" class="countdown-minutes">00</div>
                <small class="text-muted">Minutes</small>
            </div>
            <div style="background:var(--bg-card);border-radius:12px;padding:16px 20px;min-width:80px;box-shadow:var(--shadow-md);">
                <div style="font-size:2rem;font-weight:800;font-family:var(--font-heading);color:var(--primary);" class="countdown-seconds">00</div>
                <small class="text-muted">Seconds</small>
            </div>
        </div>

        <!-- Email subscription -->
        <form class="newsletter-form mb-4" style="max-width:450px;margin:0 auto;" novalidate>
            <div class="newsletter-input-wrap">
                <input type="email" class="form-control" placeholder="Enter your email for updates" required>
            </div>
            <button type="submit" class="btn btn-primary">Notify Me</button>
        </form>

        <!-- Social links -->
        <div class="d-flex gap-3 justify-content-center">
            <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);color:var(--text-secondary);transition:all 0.2s;"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);color:var(--text-secondary);transition:all 0.2s;"><i class="fab fa-instagram"></i></a>
            <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);color:var(--text-secondary);transition:all 0.2s;"><i class="fab fa-twitter"></i></a>
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);color:var(--text-secondary);transition:all 0.2s;"><i class="fab fa-youtube"></i></a>
            <a href="https://www.pinterest.com/" target="_blank" rel="noopener noreferrer" aria-label="Pinterest" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);color:var(--text-secondary);transition:all 0.2s;"><i class="fab fa-pinterest"></i></a>
        </div>
    </div>

    <!-- Theme/RTL toggles -->
    <button class="theme-toggle btn btn-primary btn-icon" style="position:fixed;bottom:20px;right:20px;z-index:100;"><i class="fas fa-moon"></i></button>
    <button class="rtl-toggle btn btn-outline btn-icon" style="position:fixed;bottom:20px;right:80px;z-index:100;"><span>RTL</span></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
